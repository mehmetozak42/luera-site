<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luera Kozmetik</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: white;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .main-image {
      max-width: 95vw;
      max-height: 68vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .countdown-area {
      width: 100%;
      margin-top: 14px;
      text-align: center;
      flex-shrink: 0;
    }

    .countdown-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #1d2d4f;
      margin-bottom: 10px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
    }

    .time-box {
      text-align: center;
      min-width: 55px;
    }

    .number {
      display: block;
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: bold;
      color: #1d2d4f;
    }

    .label {
      display: block;
      margin-top: 3px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #a48748;
    }

    @media (max-width: 600px) {
      .main-image {
        max-height: 65vh;
      }

      .countdown {
        gap: 8px;
      }

      .number {
        font-size: 25px;
      }

      .time-box {
        min-width: 50px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <img
    class="main-image"
    src="WhatsApp Image 2026-09-06 at 16.37.58.jpeg"
    alt="Luera Kozmetik Açılış"
  >

  <div class="countdown-area">

    <div class="countdown-title">
      AÇILIŞA KALAN SÜRE
    </div>

    <div class="countdown">

      <div class="time-box">
        <span class="number" id="days">--</span>
        <span class="label">GÜN</span>
      </div>

      <div class="time-box">
        <span class="number" id="hours">--</span>
        <span class="label">SAAT</span>
      </div>

      <div class="time-box">
        <span class="number" id="minutes">--</span>
        <span class="label">DAKİKA</span>
      </div>

      <div class="time-box">
        <span class="number" id="seconds">--</span>
        <span class="label">SANİYE</span>
      </div>

    </div>

  </div>

</div>

<script>
  const openingTime = new Date("2026-09-12T15:00:00+03:00").getTime();

  function updateCountdown() {

    const now = new Date().getTime();
    const distance = openingTime - now;

    if (distance <= 0) {
      document.querySelector(".countdown-area").innerHTML =
        '<div class="countdown-title">LUERA KOZMETİK AÇILDI</div>';
      return;
    }

    const days = Math.floor(distance / 86400000);
    const hours = Math.floor((distance % 86400000) / 3600000);
    const minutes = Math.floor((distance % 3600000) / 60000);
    const seconds = Math.floor((distance % 60000) / 1000);

    document.getElementById("days").textContent =
      String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
      String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
      String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
      String(seconds).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
