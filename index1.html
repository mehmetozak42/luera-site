<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Luera Kozmetik</title>

  <meta name="description"
        content="Luera Kozmetik hizmetinizde. Online mağazamız çok yakında.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #f8f4ee;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hero {
      width: 100%;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }

    @media (max-width: 600px) {
      .hero img {
        width: 100%;
        height: 100dvh;
        object-fit: contain;
      }
    }
  </style>
</head>

<body>

  <main class="hero">
    <img
      src="WhatsApp Image 2026-09-06 at 16.37.58.jpeg"
      alt="Luera Kozmetik Hizmetinizde">
  </main>

</body>
</html>
